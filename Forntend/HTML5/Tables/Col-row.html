<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>Small</th>
                <th>Large</th>
        </thead>
        <tbody>
            <tr>
                <td>Burger</td>
                <td>$5.99</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Pizza</td>
                <td>$8.99</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
